<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analysis Results - Snort Analyzer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0d1117, #1e2a47);
      color: #e6edf3;
      font-family: 'Segoe UI', sans-serif;
      padding: 40px;
    }
    .result-box {
      background: #161b22;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(0, 150, 255, 0.15);
      margin-bottom: 25px;
    }
    h3, h5 { color: #58a6ff; }
    .green-text { color: #3fb950; font-weight: bold; }
    .red-text { color: #f85149; font-weight: bold; }
    .btn-home {
      display: inline-block;
      margin-top: 20px;
      background-color: #238636;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3 class="text-center mb-4">Log Analysis Results</h3>

    <div class="result-box">
      <h5 class="{{ 'green-text' if 'Benign' in overall_status else 'red-text' }}">{{ overall_status }}</h5>
      <p>{{ reason }}</p>
    </div>

    {% if summary_table %}
    <div class="result-box">
      <h5>Prediction Summary</h5>
      {{ summary_table|safe }}
    </div>
    {% endif %}

    <div class="text-center">
      <a href="/" class="btn-home">← Back to Upload</a>
    </div>
  </div>
</body>
</html>
