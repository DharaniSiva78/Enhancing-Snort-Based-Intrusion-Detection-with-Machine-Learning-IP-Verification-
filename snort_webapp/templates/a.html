<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snort Log Analyzer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background: radial-gradient(circle at top, #0d1117, #1e2a47);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .upload-box {
      background: rgba(22, 27, 34, 0.95);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 150, 255, 0.3);
      text-align: center;
      width: 420px;
      position: relative;
    }
    h2 {
      margin-bottom: 20px;
      font-weight: bold;
      color: #58a6ff;
    }
    input[type=file] {
      width: 100%;
      margin: 15px 0;
      background: #0d1117;
      color: #ccc;
      border: 1px solid #30363d;
      padding: 10px;
      border-radius: 6px;
    }
    button {
      background: linear-gradient(90deg, #238636, #2ea043);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="upload-box">
    <h2>Snort Log Analyzer</h2>
    <form id="uploadForm" action="/analyze" method="post" enctype="multipart/form-data">
      <p>Upload your log file (.csv):</p>
      <input type="file" name="file" required>
      <br>
      <button type="submit">Analyze Log</button>
    </form>
  </div>
</body>
</html>
